name: Runtime Contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CONTROL_PLANE_TEST_DATABASE_URL: postgresql://core_agent_ci@127.0.0.1:5432/core_agent_runtime

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Build and verify contracts
        run: npm run contracts:check

      - name: Protect compatibility history
        env:
          COMPAT_HISTORY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run compat:history -w @core-agent/contracts -- --base "$COMPAT_HISTORY_BASE"

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Verify Hermes source provenance
        run: npm run hermes:source:verify

      - name: Run unit builds and tests
        run: npm run check

      - name: Scan tracked evidence for the CI sentinel
        run: node scripts/verify-no-secret.mjs synthetic-ci-sentinel-runtime-v1

  web-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Build shared contracts
        run: npm run contracts:build

      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium

      - name: Run consultant Web browser acceptance
        run: npm run test:browser -w @core-agent/control-plane-web

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm@sha256:6e5a6518f9d2ff9e9f4cba2a5a87d8f41b0f067f6f92ac847c344351a6c8d923
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: core_agent_runtime
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
          POSTGRES_PASSWORD: synthetic-ci-db-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_USER: core_agent_ci
        options: >-
          --health-cmd "pg_isready -U core_agent_ci -d core_agent_runtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Project protected CI database credential files
        env:
          CI_DATABASE_PASSWORD: synthetic-ci-db-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          install -m 0600 /dev/null "$RUNNER_TEMP/core-agent-ci-db-secret"
          printf '%s' "$CI_DATABASE_PASSWORD" > "$RUNNER_TEMP/core-agent-ci-db-secret"
          install -m 0600 /dev/null "$RUNNER_TEMP/core-agent-ci.pgpass"
          printf '127.0.0.1:5432:*:core_agent_ci:%s\n' "$CI_DATABASE_PASSWORD" > "$RUNNER_TEMP/core-agent-ci.pgpass"
          echo "PGPASSFILE=$RUNNER_TEMP/core-agent-ci.pgpass" >> "$GITHUB_ENV"
          echo "CONTROL_PLANE_TEST_DATABASE_PASSWORD_FILE=$RUNNER_TEMP/core-agent-ci-db-secret" >> "$GITHUB_ENV"

      - name: Bootstrap exact test database role prerequisites
        run: node scripts/bootstrap-test-database-roles.mjs

      - name: Run real PostgreSQL suites
        run: npm run test:postgres

      - name: Scan every public database text surface for the CI sentinel
        run: node scripts/scan-runtime-database.mjs synthetic-ci-sentinel-runtime-v1

      - name: Scan actual CI database credential from protected file
        run: node scripts/verify-no-secret.mjs --secret-file "$RUNNER_TEMP/core-agent-ci-db-secret"

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm@sha256:6e5a6518f9d2ff9e9f4cba2a5a87d8f41b0f067f6f92ac847c344351a6c8d923
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: core_agent_runtime
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
          POSTGRES_PASSWORD: synthetic-ci-db-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_USER: core_agent_ci
        options: >-
          --health-cmd "pg_isready -U core_agent_ci -d core_agent_runtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Project protected CI database credential files
        env:
          CI_DATABASE_PASSWORD: synthetic-ci-db-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          install -m 0600 /dev/null "$RUNNER_TEMP/core-agent-ci-db-secret"
          printf '%s' "$CI_DATABASE_PASSWORD" > "$RUNNER_TEMP/core-agent-ci-db-secret"
          install -m 0600 /dev/null "$RUNNER_TEMP/core-agent-ci.pgpass"
          printf '127.0.0.1:5432:*:core_agent_ci:%s\n' "$CI_DATABASE_PASSWORD" > "$RUNNER_TEMP/core-agent-ci.pgpass"
          echo "PGPASSFILE=$RUNNER_TEMP/core-agent-ci.pgpass" >> "$GITHUB_ENV"
          echo "CONTROL_PLANE_TEST_DATABASE_PASSWORD_FILE=$RUNNER_TEMP/core-agent-ci-db-secret" >> "$GITHUB_ENV"

      - name: Bootstrap exact test database role prerequisites
        run: node scripts/bootstrap-test-database-roles.mjs

      - name: Run fake Supervisor and Hermes full slice
        run: npm run test:integration

      - name: Scan integration evidence for the CI sentinel
        run: node scripts/verify-no-secret.mjs synthetic-ci-sentinel-runtime-v1

      - name: Scan actual CI database credential from protected file
        run: node scripts/verify-no-secret.mjs --secret-file "$RUNNER_TEMP/core-agent-ci-db-secret"

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Build shared contracts
        run: npm run contracts:build

      - name: Resolve approved image tags and reject lock drift
        run: |
          node scripts/resolve-runtime-images.mjs
          git diff --exit-code -- infra/runtime/base-images.lock.json

      - name: Export the locked runner platform references
        run: |
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const lock=JSON.parse(readFileSync("infra/runtime/base-images.lock.json","utf8")); process.stdout.write(`CORE_AGENT_NODE_IMAGE=${lock.images.node.platforms["linux/amd64"]}\nCORE_AGENT_POSTGRES_IMAGE=${lock.images.postgres.platforms["linux/amd64"]}\n`)' >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        env:
          CORE_AGENT_BOOTSTRAP_KEY_FILE: /tmp/core-agent-bootstrap-path-only
          CORE_AGENT_POSTGRES_BOOTSTRAP_PASSWORD_FILE: /tmp/core-agent-postgres-bootstrap-password-path-only
          CORE_AGENT_DATABASE_MIGRATOR_PASSWORD_FILE: /tmp/core-agent-database-migrator-password-path-only
          CORE_AGENT_DATABASE_APP_PASSWORD_FILE: /tmp/core-agent-database-app-password-path-only
          CORE_AGENT_DATABASE_IDENTITY_PASSWORD_FILE: /tmp/core-agent-database-identity-password-path-only
          CORE_AGENT_CREDENTIAL_MOUNT_GID: "1001"
          CORE_AGENT_CREDENTIAL_MOUNT_UID: "1001"
          CORE_AGENT_API_GID: "1001"
          CORE_AGENT_API_UID: "1001"
          CORE_AGENT_RUNTIME_UID: "1002"
          CORE_AGENT_SUPERVISOR_SOCKET_GID: "1002"
          CORE_AGENT_DOCKER_GID: "999"
          CORE_AGENT_DOCKER_SOCKET_SOURCE: /var/run/docker.sock
          CORE_AGENT_HERMES_IMAGE_LOCK_FILE: /tmp/core-agent-product-image-lock-path-only
          CORE_AGENT_INGRESS_SECRET_ROOT: /tmp/core-agent-ingress-path-only
          CORE_AGENT_PLATFORM: linux/amd64
          CORE_AGENT_PROVIDER_SECRET_ROOT: /tmp/core-agent-provider-path-only
          CORE_AGENT_SUPERVISOR_STATE_ROOT: /tmp/core-agent-runtime-state-path-only
        run: docker compose -f infra/runtime/compose.dev.yaml config --quiet

      - name: Run static topology assertions
        run: npm run test:runtime

      - name: Run disposable PostgreSQL authentication topology
        run: npm run test:runtime:database-auth-topology

      - name: Run fresh CI-equivalent PostgreSQL and integration suites
        run: npm run test:runtime:database-ci-equivalent
