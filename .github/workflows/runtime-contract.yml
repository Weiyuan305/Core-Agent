name: Runtime Contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Run runtime and contracts tests
        run: npm test

      - name: Build and verify contracts
        run: npm run contracts:check

      - name: Protect compatibility history
        env:
          COMPAT_HISTORY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run compat:history -w @core-agent/contracts -- --base "$COMPAT_HISTORY_BASE"

      - name: Validate Compose configuration
        env:
          CORE_AGENT_HERMES_INGRESS_SECRET_FILE: /dev/null
        run: docker compose -f infra/hermes/compose.dev.yaml config --quiet
