name: core-agent-runtime-v1

x-service-build: &service-build
  context: ../..
  dockerfile: infra/runtime/Dockerfile
  args:
    NODE_IMAGE: ${CORE_AGENT_NODE_IMAGE:?set CORE_AGENT_NODE_IMAGE}

x-application-security: &application-security
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  mem_limit: 1g
  cpus: 1.0
  stop_grace_period: 30s
  restart: unless-stopped

services:
  database-credential-projector:
    image: core-agent/control-plane-api:dev
    platform: ${CORE_AGENT_PLATFORM:?set CORE_AGENT_PLATFORM}
    build:
      <<: *service-build
      target: api
    user: "0:0"
    entrypoint: ["node", "scripts/project-runtime-database-credentials.mjs"]
    environment:
      CORE_AGENT_API_GID: ${CORE_AGENT_API_GID:-12000}
      CORE_AGENT_API_UID: ${CORE_AGENT_API_UID:-12000}
      CORE_AGENT_CREDENTIAL_SOURCE_GID: ${CORE_AGENT_CREDENTIAL_MOUNT_GID:?set CORE_AGENT_CREDENTIAL_MOUNT_GID}
      CORE_AGENT_CREDENTIAL_SOURCE_UID: ${CORE_AGENT_CREDENTIAL_MOUNT_UID:?set CORE_AGENT_CREDENTIAL_MOUNT_UID}
      CORE_AGENT_WORKER_GID: ${CORE_AGENT_WORKER_GID:-12002}
      CORE_AGENT_WORKER_UID: ${CORE_AGENT_WORKER_UID:-12002}
    volumes:
      - type: bind
        source: ${CORE_AGENT_POSTGRES_BOOTSTRAP_PASSWORD_FILE:?set CORE_AGENT_POSTGRES_BOOTSTRAP_PASSWORD_FILE}
        target: /run/core-agent/credential-sources/bootstrap
        read_only: true
      - type: bind
        source: ${CORE_AGENT_DATABASE_MIGRATOR_PASSWORD_FILE:?set CORE_AGENT_DATABASE_MIGRATOR_PASSWORD_FILE}
        target: /run/core-agent/credential-sources/migrator
        read_only: true
      - type: bind
        source: ${CORE_AGENT_DATABASE_APP_PASSWORD_FILE:?set CORE_AGENT_DATABASE_APP_PASSWORD_FILE}
        target: /run/core-agent/credential-sources/application
        read_only: true
      - type: bind
        source: ${CORE_AGENT_DATABASE_IDENTITY_PASSWORD_FILE:?set CORE_AGENT_DATABASE_IDENTITY_PASSWORD_FILE}
        target: /run/core-agent/credential-sources/identity
        read_only: true
      - { type: volume, source: postgres-credentials, target: /run/core-agent/projected/postgres }
      - { type: volume, source: role-bootstrap-credentials, target: /run/core-agent/projected/role-bootstrap }
      - { type: volume, source: postgres-auth-credentials, target: /run/core-agent/projected/auth }
      - { type: volume, source: migrate-credentials, target: /run/core-agent/projected/migrate }
      - { type: volume, source: api-credentials, target: /run/core-agent/projected/api }
      - { type: volume, source: worker-credentials, target: /run/core-agent/projected/worker }
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    privileged: false
    network_mode: none
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    restart: "no"
    stop_grace_period: 5s

  postgres:
    image: ${CORE_AGENT_POSTGRES_IMAGE:?set CORE_AGENT_POSTGRES_IMAGE}
    platform: ${CORE_AGENT_PLATFORM:?set CORE_AGENT_PLATFORM}
    environment:
      POSTGRES_DB: core_agent_runtime
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
      POSTGRES_PASSWORD_FILE: /run/core-agent/database-credentials/database-password
      POSTGRES_USER: core_agent_bootstrap
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql/data
      - type: bind
        source: ./postgres/init
        target: /docker-entrypoint-initdb.d
        read_only: true
      - type: volume
        source: postgres-credentials
        target: /run/core-agent/database-credentials
        read_only: true
    depends_on:
      database-credential-projector:
        condition: service_completed_successfully
    networks:
      - core-agent-control
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core_agent_bootstrap -d core_agent_runtime"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

  identity-role-bootstrap:
    image: core-agent/control-plane-api:dev
    platform: ${CORE_AGENT_PLATFORM:?set CORE_AGENT_PLATFORM}
    build:
      <<: *service-build
      target: api
    user: "12003:12003"
    entrypoint: ["node", "scripts/bootstrap-runtime-database-auth.mjs"]
    environment:
      CONTROL_PLANE_DATABASE_URL: postgresql://core_agent_bootstrap@postgres:5432/core_agent_runtime
      CONTROL_PLANE_DATABASE_PASSWORD_FILE: /run/core-agent/database-credentials/bootstrap-password
      CORE_AGENT_APP_DATABASE_PASSWORD_FILE: /run/core-agent/database-credentials/application-password
      CORE_AGENT_IDENTITY_DATABASE_PASSWORD_FILE: /run/core-agent/database-credentials/identity-password
      CORE_AGENT_MIGRATOR_DATABASE_PASSWORD_FILE: /run/core-agent/database-credentials/migrator-password
    volumes:
      - type: volume
        source: role-bootstrap-credentials
        target: /run/core-agent/database-credentials
        read_only: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    privileged: false
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    restart: "no"
    stop_grace_period: 10s
    depends_on:
      database-credential-projector:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - core-agent-control

  postgres-auth-convergence:
    image: core-agent/control-plane-api:dev
    platform: ${CORE_AGENT_PLATFORM:?set CORE_AGENT_PLATFORM}
    build:
      <<: *service-build
      target: api
    user: "999:999"
    entrypoint: ["node", "scripts/converge-runtime-postgres-auth.mjs"]
    environment:
      CONTROL_PLANE_DATABASE_URL: postgresql://core_agent_bootstrap@postgres:5432/core_agent_runtime
      CONTROL_PLANE_DATABASE_PASSWORD_FILE: /run/core-agent/database-credentials/database-password
      PGDATA: /var/lib/postgresql/data
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql/data
      - type: volume
        source: postgres-auth-credentials
        target: /run/core-agent/database-credentials
        read_only: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    privileged: false
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    restart: "no"
    stop_grace_period: 10s
    depends_on:
      identity-role-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - core-agent-control

  migrate:
    image: core-agent/control-plane-api:dev
    platform: ${CORE_AGENT_PLATFORM:?set CORE_AGENT_PLATFORM}
    build:
      <<: *service-build
      target: api
    user: "12004:12004"
    entrypoint: ["node", "scripts/migrate-runtime.mjs"]
    environment:
      CONTROL_PLANE_DATABASE_URL: postgresql://core_agent_migrator@postgres:5432/core_agent_runtime
      CONTROL_PLANE_DATABASE_PASSWORD_FILE: /run/core-agent/database-credentials/database-password
    volumes:
      - type: volume
        source: migrate-credentials
        target: /run/core-agent/database-credentials
        read_only: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    restart: "no"
    stop_grace_period: 15s
    depends_on:
      postgres-auth-convergence:
        condition: service_completed_successfully
    networks:
      - core-agent-control

  api:
    <<: *application-security
    image: core-agent/control-plane-api:dev
    platform: ${CORE_AGENT_PLATFORM:?set CORE_AGENT_PLATFORM}
    build:
      <<: *service-build
      target: api
    user: "${CORE_AGENT_API_UID:-12000}:${CORE_AGENT_API_GID:-12000}"
    environment:
      CONTROL_PLANE_API_CONTAINER_BIND: "1"
      CONTROL_PLANE_API_HOST: 0.0.0.0
      CONTROL_PLANE_API_PORT: "8787"
      CONTROL_PLANE_BOOTSTRAP_KEY_FILE: /run/secrets/bootstrap_key
      CONTROL_PLANE_DATABASE_URL: postgresql://core_agent_app@postgres:5432/core_agent_runtime
      CONTROL_PLANE_DATABASE_PASSWORD_FILE: /run/core-agent/database-credentials/database-password
      CONTROL_PLANE_IMAGE_LOCK_FILE: /run/core-agent/config/hermes-images.lock.json
      CONTROL_PLANE_PROVIDER_CATALOG_FILE: /app/infra/runtime/providers.json
      CONTROL_PLANE_SECRET_ROOT: /run/unavailable/api-secrets
      CONTROL_PLANE_SUPERVISOR_SOCKET: /run/unavailable/supervisor.sock
      CONTROL_PLANE_WORKER_ID: api-unused
    secrets:
      - source: bootstrap-key
        target: bootstrap_key
        uid: "${CORE_AGENT_API_UID:-12000}"
        gid: "${CORE_AGENT_API_GID:-12000}"
        mode: 0o600
    volumes:
      - type: bind
        source: ${CORE_AGENT_HERMES_IMAGE_LOCK_FILE:?set CORE_AGENT_HERMES_IMAGE_LOCK_FILE}
        target: /run/core-agent/config/hermes-images.lock.json
        read_only: true
      - type: bind
        source: ./providers.dev.json
        target: /app/infra/runtime/providers.json
        read_only: true
      - type: volume
        source: api-credentials
        target: /run/core-agent/database-credentials
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - core-agent-control

  api-ingress:
    <<: *application-security
    image: core-agent/control-plane-api:dev
    platform: ${CORE_AGENT_PLATFORM:?set CORE_AGENT_PLATFORM}
    build:
      <<: *service-build
      target: api
    user: "${CORE_AGENT_API_UID:-12000}:${CORE_AGENT_API_GID:-12000}"
    entrypoint: ["node", "scripts/api-ingress-proxy.mjs"]
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    stop_grace_period: 10s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      api:
        condition: service_started
    networks:
      - core-agent-control
      - core-agent-host-ingress

  worker:
    <<: *application-security
    image: core-agent/control-plane-worker:dev
    platform: ${CORE_AGENT_PLATFORM:?set CORE_AGENT_PLATFORM}
    build:
      <<: *service-build
      target: worker
    user: "${CORE_AGENT_WORKER_UID:-12002}:${CORE_AGENT_WORKER_GID:-12002}"
    group_add:
      - "${CORE_AGENT_SUPERVISOR_SOCKET_GID:-12002}"
    environment:
      CONTROL_PLANE_BOOTSTRAP_KEY_FILE: /run/unavailable/bootstrap-key
      CONTROL_PLANE_DATABASE_URL: postgresql://core_agent_app@postgres:5432/core_agent_runtime
      CONTROL_PLANE_DATABASE_PASSWORD_FILE: /run/core-agent/database-credentials/database-password
      CONTROL_PLANE_PROVIDER_CATALOG_FILE: /app/infra/runtime/providers.json
      CONTROL_PLANE_SECRET_ROOT: /run/core-agent/ingress
      CONTROL_PLANE_SUPERVISOR_SOCKET: /run/core-agent/supervisor/runtime.sock
      CONTROL_PLANE_WORKER_ID: runtime-worker-1
    volumes:
      - type: bind
        source: ./providers.dev.json
        target: /app/infra/runtime/providers.json
        read_only: true
      - type: bind
        source: ${CORE_AGENT_INGRESS_SECRET_ROOT:?set CORE_AGENT_INGRESS_SECRET_ROOT}
        target: /run/core-agent/ingress
        read_only: true
      - type: volume
        source: supervisor-socket
        target: /run/core-agent/supervisor
        read_only: true
      - type: volume
        source: worker-credentials
        target: /run/core-agent/database-credentials
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      supervisor:
        condition: service_started
    networks:
      - core-agent-control
      - core-agent-backplane

  supervisor-socket-volume-init:
    image: core-agent/runtime-supervisor:dev
    platform: ${CORE_AGENT_PLATFORM:?set CORE_AGENT_PLATFORM}
    build:
      <<: *service-build
      target: supervisor
    user: "0:0"
    entrypoint: ["node", "scripts/prepare-supervisor-socket-volume.mjs"]
    environment:
      CORE_AGENT_RUNTIME_UID: ${CORE_AGENT_RUNTIME_UID:-12002}
      CORE_AGENT_SUPERVISOR_SOCKET_GID: ${CORE_AGENT_SUPERVISOR_SOCKET_GID:-12002}
    volumes:
      - type: volume
        source: supervisor-socket
        target: /run/core-agent/supervisor
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true
    privileged: false
    network_mode: none
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    restart: "no"
    stop_grace_period: 5s

  supervisor-socket-preflight:
    image: core-agent/runtime-supervisor:dev
    platform: ${CORE_AGENT_PLATFORM:?set CORE_AGENT_PLATFORM}
    build:
      <<: *service-build
      target: supervisor
    user: "${CORE_AGENT_RUNTIME_UID:-12002}:${CORE_AGENT_SUPERVISOR_SOCKET_GID:-12002}"
    group_add:
      - "${CORE_AGENT_DOCKER_GID:?set CORE_AGENT_DOCKER_GID}"
    entrypoint: ["node", "scripts/preflight-runtime-docker-socket.mjs"]
    environment:
      CORE_AGENT_DOCKER_GID: ${CORE_AGENT_DOCKER_GID:?set CORE_AGENT_DOCKER_GID}
      CORE_AGENT_DOCKER_SOCKET_PATH: /var/run/docker.sock
      CORE_AGENT_DOCKER_SOCKET_SOURCE: ${CORE_AGENT_DOCKER_SOCKET_SOURCE:?set CORE_AGENT_DOCKER_SOCKET_SOURCE}
      CORE_AGENT_RUNTIME_UID: ${CORE_AGENT_RUNTIME_UID:-12002}
      CORE_AGENT_SUPERVISOR_SOCKET_GID: ${CORE_AGENT_SUPERVISOR_SOCKET_GID:-12002}
    volumes:
      - type: bind
        source: ${CORE_AGENT_DOCKER_SOCKET_SOURCE:?set CORE_AGENT_DOCKER_SOCKET_SOURCE}
        target: /var/run/docker.sock
        read_only: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    privileged: false
    network_mode: none
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    restart: "no"
    stop_grace_period: 5s

  supervisor:
    <<: *application-security
    image: core-agent/runtime-supervisor:dev
    platform: ${CORE_AGENT_PLATFORM:?set CORE_AGENT_PLATFORM}
    build:
      <<: *service-build
      target: supervisor
    user: "${CORE_AGENT_RUNTIME_UID:-12002}:${CORE_AGENT_SUPERVISOR_SOCKET_GID:-12002}"
    group_add:
      - "${CORE_AGENT_DOCKER_GID:?set CORE_AGENT_DOCKER_GID}"
    privileged: false
    network_mode: none
    depends_on:
      supervisor-socket-preflight:
        condition: service_completed_successfully
      supervisor-socket-volume-init:
        condition: service_completed_successfully
    environment:
      CORE_AGENT_DOCKER_SOCKET_PATH: /var/run/docker.sock
      CORE_AGENT_IMAGE_LOCK_PATH: /run/core-agent/config/hermes-images.lock.json
      CORE_AGENT_INGRESS_SECRET_ROOT: /run/core-agent/secrets/ingress
      CORE_AGENT_MANAGED_RUNTIME_GID: ${CORE_AGENT_SUPERVISOR_SOCKET_GID:-12002}
      CORE_AGENT_MANAGED_RUNTIME_UID: ${CORE_AGENT_RUNTIME_UID:-12002}
      CORE_AGENT_PROVIDER_CATALOG_PATH: /app/infra/runtime/providers.json
      CORE_AGENT_PROVIDER_SECRET_ROOT: /run/core-agent/secrets/provider
      CORE_AGENT_DOCKER_HOST_INGRESS_ROOT: ${CORE_AGENT_SUPERVISOR_STATE_ROOT:?set CORE_AGENT_SUPERVISOR_STATE_ROOT}/ingress
      CORE_AGENT_DOCKER_HOST_STAGING_ROOT: ${CORE_AGENT_SUPERVISOR_STATE_ROOT:?set CORE_AGENT_SUPERVISOR_STATE_ROOT}/staging
      CORE_AGENT_SUPERVISOR_INGRESS_ROOT: /run/core-agent/ingress
      CORE_AGENT_SUPERVISOR_JOURNAL_ROOT: /var/lib/core-agent/supervisor/journal
      CORE_AGENT_SUPERVISOR_SOCKET_PATH: /run/core-agent/supervisor/runtime.sock
      CORE_AGENT_SUPERVISOR_STAGING_ROOT: /run/core-agent/staging
    volumes:
      - type: bind
        source: ${CORE_AGENT_HERMES_IMAGE_LOCK_FILE:?set CORE_AGENT_HERMES_IMAGE_LOCK_FILE}
        target: /run/core-agent/config/hermes-images.lock.json
        read_only: true
      - type: bind
        source: ./providers.dev.json
        target: /app/infra/runtime/providers.json
        read_only: true
      - type: bind
        source: ${CORE_AGENT_PROVIDER_SECRET_ROOT:?set CORE_AGENT_PROVIDER_SECRET_ROOT}
        target: /run/core-agent/secrets/provider
        read_only: true
      - type: bind
        source: ${CORE_AGENT_INGRESS_SECRET_ROOT:?set CORE_AGENT_INGRESS_SECRET_ROOT}
        target: /run/core-agent/secrets/ingress
        read_only: true
      - type: volume
        source: supervisor-socket
        target: /run/core-agent/supervisor
      - type: bind
        source: ${CORE_AGENT_SUPERVISOR_STATE_ROOT:?set CORE_AGENT_SUPERVISOR_STATE_ROOT}
        target: /var/lib/core-agent/supervisor
      - type: bind
        source: ${CORE_AGENT_SUPERVISOR_STATE_ROOT:?set CORE_AGENT_SUPERVISOR_STATE_ROOT}/staging
        target: /run/core-agent/staging
      - type: bind
        source: ${CORE_AGENT_SUPERVISOR_STATE_ROOT:?set CORE_AGENT_SUPERVISOR_STATE_ROOT}/ingress
        target: /run/core-agent/ingress
      - type: bind
        source: ${CORE_AGENT_DOCKER_SOCKET_SOURCE:?set CORE_AGENT_DOCKER_SOCKET_SOURCE}
        target: /var/run/docker.sock
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777

volumes:
  api-credentials:
  migrate-credentials:
  postgres-auth-credentials:
  postgres-credentials:
  postgres-data:
  role-bootstrap-credentials:
  supervisor-socket:
  worker-credentials:

secrets:
  bootstrap-key:
    file: ${CORE_AGENT_BOOTSTRAP_KEY_FILE:?set CORE_AGENT_BOOTSTRAP_KEY_FILE}

networks:
  core-agent-control:
    driver: bridge
    internal: true
  core-agent-host-ingress:
    driver: bridge
    internal: false
  core-agent-backplane:
    external: true
    name: core-agent-backplane
  core-agent-egress:
    external: true
    name: core-agent-egress
