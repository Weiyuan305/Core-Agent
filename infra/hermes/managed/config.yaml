gateway:
  multiplex_profiles: true

platform_toolsets:
  api_server:
    - clarify
  cli:
    - clarify

plugins:
  enabled:
    - core-agent-policy

mcp_servers:
  core_agent_gateway:
    url: http://policy-gateway-ingress:8787/mcp
    headers:
      Authorization: "Bearer ${CORE_AGENT_POLICY_RUNTIME_TOKEN}"
    strict_redirect_headers: true
    skip_preflight: true
    connect_timeout: 5
    timeout: 30

security:
  redact_secrets: true

skills:
  write_approval: true

memory:
  write_approval: true
